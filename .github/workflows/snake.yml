name: Generate Snake

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'   # once daily is plenty; hourly is unnecessary and can get throttled
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: deepakydv641
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: actions/upload-artifact@v4
        with:
          name: github-contribution-grid-snake
          path: dist/

      - name: push to output branch
        run: |
          cd dist
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add -A
          git commit -m "generate snake"
          git push origin master:output --force
